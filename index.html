<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sinaptiks-ia-business-builder</title>
    <script>
      // Aplica el tema antes de que React monte para no pintar el flash del
      // tema equivocado. Tiene que reproducir exactamente la misma lógica que
      // getInitialTheme() en src/hooks/use-theme.tsx.
      try {
        var stored = localStorage.getItem('sinaptkis-theme')
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
